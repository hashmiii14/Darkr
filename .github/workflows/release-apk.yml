name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Commit and Push APK directly to Repository
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk ./Darkr.apk
        mkdir -p docs
        cp app/build/outputs/apk/debug/app-debug.apk docs/Darkr.apk
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add ./Darkr.apk docs/Darkr.apk
        git commit -m "build: publish direct download Darkr.apk" || echo "No changes"
        git push origin main || true

    - name: Create or Update GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v1.0.5"
        gh release create $TAG ./Darkr.apk --title "Darkr $TAG (Android APK)" --notes "### 🌑 Darkr Android APK Direct Download" || gh release upload $TAG ./Darkr.apk --clobber || true
