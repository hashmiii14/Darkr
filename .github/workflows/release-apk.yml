name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Commit APK to Repo and Publish Native Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk ./Darkr.apk
        mkdir -p docs
        cp app/build/outputs/apk/debug/app-debug.apk docs/Darkr.apk
        
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git add Darkr.apk docs/Darkr.apk
        git commit -m "build: attach compiled Darkr.apk for instant 1-tap download" || true
        git push origin main || true
        
        gh release delete v1.0.9 --yes || true
        gh release create v1.0.9 ./Darkr.apk --title "Darkr v1.0.9 (Direct Android APK)" --notes "Direct 1-tap download link for Android" || true
