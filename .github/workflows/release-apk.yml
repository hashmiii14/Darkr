name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Darkr-APK-v1.0
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90

    - name: Upload to Public File Servers
      run: |
        APK="app/build/outputs/apk/debug/app-debug.apk"
        
        echo "Uploading to Catbox..."
        CB_URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@$APK" https://catbox.moe/user/api.php || echo "")
        echo "Catbox: $CB_URL"
        
        echo "Uploading to 0x0.st..."
        ZX_URL=$(curl -s -F "file=@$APK" https://0x0.st || echo "")
        echo "0x0: $ZX_URL"
        
        echo "Uploading to bashupload..."
        BU_URL=$(curl -s -T "$APK" https://bashupload.com/Darkr.apk | grep -o 'https://bashupload.com/[^ ]*' | head -n 1 || echo "")
        echo "Bashupload: $BU_URL"
        
        echo "## 🚀 Darkr Android APK Direct Download Links" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Catbox Direct Link (1-Tap)**: $CB_URL" >> $GITHUB_STEP_SUMMARY
        echo "- **0x0.st Direct Link**: $ZX_URL" >> $GITHUB_STEP_SUMMARY
        echo "- **Bashupload Direct Link**: $BU_URL" >> $GITHUB_STEP_SUMMARY
