name: Release Darkr APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK to docs for direct web download
        run: |
          mkdir -p docs
          cp app/build/outputs/apk/debug/app-debug.apk docs/Darkr.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./Darkr.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./Darkr.apk
            app/build/outputs/apk/debug/app-debug.apk
          name: Darkr v1.0.3 (Android APK)
          draft: false
          prerelease: false
          body: |
            ## 🌑 Darkr v1.0.3 Android APK

            ### 🚀 Direct Download:
            Click `Darkr.apk` or `app-debug.apk` below to download directly to your phone!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
