name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Prepare and Copy APK
      run: |
        ls -la app/build/outputs/apk/debug/
        cp app/build/outputs/apk/debug/app-debug.apk ./Darkr.apk
        mkdir -p docs
        cp app/build/outputs/apk/debug/app-debug.apk docs/Darkr.apk
        ls -lh ./Darkr.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Darkr-APK-Download
        path: ./Darkr.apk

    - name: Publish to GitHub Release v1.0.9
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.9
        name: Darkr v1.0.9 (Direct Android APK Download)
        files: ./Darkr.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
