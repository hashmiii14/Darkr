name: Release Darkr APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Create Release and Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./Darkr.apk
          gh release delete ${{ github.ref_name }} --yes || true
          gh release create ${{ github.ref_name }} ./Darkr.apk --title "Darkr ${{ github.ref_name }} (Android APK)" --notes "### 🌑 Darkr ${{ github.ref_name }} Android APK

          Tap **Darkr.apk** below to download directly to your phone!"
