name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Publish Instant Public Download Link & Issue
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK="app/build/outputs/apk/debug/app-debug.apk"
        
        # 1. Catbox
        CB_URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@$APK" https://catbox.moe/user/api.php || echo "")
        echo "CB_URL=$CB_URL"
        
        # 2. 0x0.st
        ZX_URL=$(curl -s -F "file=@$APK" https://0x0.st || echo "")
        echo "ZX_URL=$ZX_URL"
        
        # 3. Create Public GitHub Issue with Direct Download Links
        BODY="## 🌑 Darkr Android APK Direct Download (100% Working)

        Click either link below to download directly to your phone:

        - 🚀 **Direct Download Server 1 (Instant)**: $CB_URL
        - 🚀 **Direct Download Server 2 (Backup)**: $ZX_URL

        ### 📲 Installation:
        1. Download the APK from the link above.
        2. Tap Install on your Android device.
        3. Open Darkr and grant 'Display over other apps' permission."

        gh issue create --title "📲 Darkr APK Direct Download Link (Latest)" --body "$BODY" || true
