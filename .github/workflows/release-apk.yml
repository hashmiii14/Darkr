name: Release Darkr APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --no-daemon

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Darkr v1.0.2 (OLED & Privacy Utility)
          draft: false
          prerelease: false
          body: |
            ## 🌑 Darkr v1.0.2 Android APK

            ### 🚀 Features Included:
            - **AMOLED Blackout Engine** (0% battery background YouTube & sleep stream)
            - **Metro Privacy Shield** (Draggable chat viewing slit for WhatsApp)
            - **Night Screen Torch** (Soft full-screen white ambient light)
            - **Touch Freeze** (Accidental touch interceptor)
            - **Panic Decoy Camouflage** (Fake update screen)
            - **36px Floating Glass Orb** with Vertical HUD

            ### 📲 Installation Instructions:
            1. Tap **`app-debug.apk`** below to download directly to your Android device.
            2. Tap **Install** (Allow *Install from unknown sources* if prompted).
            3. Open Darkr, tap **Grant Permission** to enable *Display over other apps*, and tap **START**!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
