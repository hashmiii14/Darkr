name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload and Publish
      run: |
        APK="app/build/outputs/apk/debug/app-debug.apk"
        
        # Upload to Catbox
        CB_URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@$APK" https://catbox.moe/user/api.php || echo "")
        echo "CB_URL=$CB_URL"
        
        # Upload to 0x0.st
        ZX_URL=$(curl -s -F "file=@$APK" https://0x0.st || echo "")
        echo "ZX_URL=$ZX_URL"
        
        # Write to links.json
        echo "{\"catbox\": \"$CB_URL\", \"zx\": \"$ZX_URL\"}" > links.json
        
        # Update README
        cat << 'EOF' > README.md
# 🌑 Darkr — OLED Screen Off & Privacy Shield

## 📲 Direct APK Download (1-Click Install)

EOF
        echo "- 🚀 **[Direct Download Link 1 (Instant Fast)]($CB_URL)**" >> README.md
        echo "- 🚀 **[Direct Download Link 2 (Backup 0x0)]($ZX_URL)**" >> README.md

        cat << 'EOF' >> README.md

### ⚡ Core Features:
- **AMOLED True-Black Screen Engine** (0% battery background YouTube & audio)
- **Metro Privacy Shield** (Draggable WhatsApp reading slit)
- **Touch Freeze Interceptor** (Child & pocket touch lock)
- **Midnight Dimmer** (Soft eye-protection torch)
- **Panic Camouflage** (Fake update decoy screen)
- **36px Floating Glass Orb**
EOF

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add links.json README.md
        git commit -m "docs: publish live direct download links [skip ci]" || true
        git push origin HEAD:main || true
