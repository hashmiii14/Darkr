name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Locate and Copy APK
      run: |
        find . -name "*debug.apk" -exec cp -v {} ./Darkr.apk \;
        mkdir -p docs
        cp -v ./Darkr.apk docs/Darkr.apk

    - name: Upload APK as Direct Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Darkr-Release-APK
        path: ./Darkr.apk

    - name: Commit and Push APK directly to Repository
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -f ./Darkr.apk docs/Darkr.apk
        git commit -m "build: publish direct download Darkr.apk" || echo "No changes"
        git push origin main || true

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./Darkr.apk
        tag_name: latest
        name: Darkr Android APK (Latest)
        body: |
          ## 🌑 Darkr Android APK Direct Download
          
          Tap **Darkr.apk** below to download directly to your Android device!
