name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload to Catbox and Generate Direct Link
      run: |
        python3 -c '
import os, glob, requests
apk_files = glob.glob("app/build/outputs/apk/debug/*.apk")
print("Found files:", apk_files)
if apk_files:
    apk_path = apk_files[0]
    with open(apk_path, "rb") as f:
        res = requests.post("https://catbox.moe/user/api.php", data={"reqtype": "fileupload"}, files={"fileToUpload": f})
        url = res.text.strip()
        print("========================================")
        print("DIRECT APK DOWNLOAD LINK:", url)
        print("========================================")
        with open("catbox_link.txt", "w") as out:
            out.write(url)
'

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Darkr-Android-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: Darkr v1.0.0 (Android APK)
        files: app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
        make_latest: "true"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
