name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload to Instant Public Download Links
      run: |
        echo "=== Direct Temp.sh Link ==="
        curl -F "file=@app/build/outputs/apk/debug/app-debug.apk" https://temp.sh/upload | tee tempsh_link.txt
        echo ""
        echo "=== Direct Catbox Link ==="
        curl -F "reqtype=fileupload" -F "fileToUpload=@app/build/outputs/apk/debug/app-debug.apk" https://catbox.moe/user/api.php | tee catbox_link.txt
        echo ""

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Darkr-APK
        path: app/build/outputs/apk/debug/app-debug.apk
