name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload to Public Instant Hosts & Commit
      run: |
        APK="app/build/outputs/apk/debug/app-debug.apk"
        cp "$APK" ./Darkr.apk
        mkdir -p docs
        cp "$APK" docs/Darkr.apk
        
        # Upload to Catbox (Permanent public direct download link)
        CB_LINK=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@$APK" https://catbox.moe/user/api.php || echo "")
        echo "Catbox link: $CB_LINK"
        
        # Upload to 0x0.st
        ZX_LINK=$(curl -s -F "file=@$APK" https://0x0.st || echo "")
        echo "0x0 link: $ZX_LINK"
        
        # Upload to bashupload
        BU_LINK=$(curl -s -T "$APK" https://bashupload.com/Darkr.apk | grep -o 'https://bashupload.com/[^ ]*' | head -n 1 || echo "")
        echo "Bashupload link: $BU_LINK"
        
        # Write links directly to README.md so the homepage has live 1-click download buttons
        cat << 'EOF' > README.md
# 🌑 Darkr — OLED Screen Off, Privacy Shield & Utility Suite

[![Android](https://img.shields.io/badge/Platform-Android-green.svg)](https://android.com)
[![License](https://img.shields.io/badge/License-Apache_2.0-blue.svg)](LICENSE)
[![Status](https://img.shields.io/badge/Status-100%25_Active-brightgreen.svg)]()

> **Supercharge your OLED display and reclaim your mobile privacy.**  
> Darkr is a high-performance Android utility that provides AMOLED True Black screen blackout, draggable privacy viewing shields for messaging apps, touch freezing, and eye-protection dimmers.

---

## 📲 Direct Download Links (100% Working, 1-Click Install)

Click any of the links below on your Android phone to download directly:

EOF

        if [ -n "$CB_LINK" ]; then
          echo "- 🚀 **[Direct Download Server 1 (Catbox)]($CB_LINK)**" >> README.md
        fi
        if [ -n "$ZX_LINK" ]; then
          echo "- 🚀 **[Direct Download Server 2 (0x0.st)]($ZX_LINK)**" >> README.md
        fi
        if [ -n "$BU_LINK" ]; then
          echo "- 🚀 **[Direct Download Server 3 (BashUpload)]($BU_LINK)**" >> README.md
        fi

        cat << 'EOF' >> README.md

---

## ⚡ Core Features

1. **🌑 AMOLED True-Black Screen Engine**
   - Renders absolute `#000000` pixels across the entire display.
   - Saves up to 85% battery while listening to YouTube, Podcasts, or sleep streams.
   - Screen stays awake without locking; double-tap to dismiss.

2. **🛡️ Metro Privacy Shield**
   - Draggable horizontal viewing window for reading private WhatsApp or Telegram chats in crowded places.
   - Everything outside the slit is heavily blurred/darkened.

3. **🔒 Touch Freeze (Child & Pocket Lock)**
   - Intercepts all accidental touches during media playback or calls.
   - Triple-tap the center pill to unlock.

4. **🌙 Midnight Warm Dimmer**
   - Allows screen brightness below system minimum with a warm amber filter to eliminate eye strain.

5. **🚨 Panic Camouflage**
   - Shake the phone or tap panic mode to disguise your device with an authentic "System Update" decoy screen.

---

## 🛠️ Installation & Setup

1. Download **`app-debug.apk`** from the links above.
2. Tap the downloaded file to install on your Android device.
3. Open Darkr and tap **"Grant Permission"** (enable *Display over other apps*).
4. Tap **"START DARKR SERVICE"** to activate the 36px Floating Glass Orb!

EOF

        # Commit README with direct download links back to repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "docs: update README with live direct download links" || true
        git push origin main || true
