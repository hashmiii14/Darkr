name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Darkr-App
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Official GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk ./Darkr.apk
        gh release delete v1.0.0 --yes || true
        gh release create v1.0.0 ./Darkr.apk --title "Darkr Official APK (v1.0.0)" --notes "### 🌑 Darkr APK Direct Download"
