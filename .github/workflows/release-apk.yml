name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Copy APK to Root
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk ./Darkr.apk
        mkdir -p docs
        cp app/build/outputs/apk/debug/app-debug.apk docs/Darkr.apk
        ls -lh ./Darkr.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Darkr-APK
        path: ./Darkr.apk

    - name: Publish to GitHub Release v1.0.0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: Darkr v1.0.0 (OLED Screen & Privacy Suite)
        files: ./Darkr.apk
        draft: false
        prerelease: false
        body: |
          ## 🌑 Darkr v1.0.0 Android APK
          
          Directly tap **Darkr.apk** below to download and install on your phone!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
