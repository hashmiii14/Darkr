name: Build and Release Darkr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew :app:assembleDebug --no-daemon

    - name: Prepare APK File
      run: |
        APK_FILE=$(find app/build/outputs/ -name "*.apk" | head -n 1)
        echo "Found APK: $APK_FILE"
        cp "$APK_FILE" ./Darkr.apk

    - name: Upload to Public Instant Links
      run: |
        echo "## 📲 Direct APK Download Links" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        TEMPLINK=$(curl -s -F "file=@./Darkr.apk" https://temp.sh/upload)
        echo "- **Direct Download (Instant)**: [$TEMPLINK]($TEMPLINK)" >> $GITHUB_STEP_SUMMARY
        echo "Generated temp.sh link: $TEMPLINK"

    - name: Create Unique GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="release-$(date +'%Y%m%d-%H%M%S')"
        gh release create "$TAG_NAME" ./Darkr.apk --title "Darkr App ($TAG_NAME)" --notes "### 🌑 Darkr Android APK Direct Download

        Directly download Darkr.apk and install on your phone!"
